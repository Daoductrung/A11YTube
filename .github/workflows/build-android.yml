name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Configure Flutter
      run: |
        flutter config --no-analytics
        flutter doctor -v

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        pip install -r android_version/requirements.txt

    - name: Build Android APK
      # Use 'yes' to handle potential interactive prompts from Flet CLI
      # Use --verbose to debug
      run: |
        yes | flet build apk --project android_version --verbose --include-packages flet yt_dlp requests ffmpeg_python

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A11YTube-Android
        path: |
          build/apk/*.apk
          android_version/build/apk/*.apk
          **/*.apk
        if-no-files-found: warn
